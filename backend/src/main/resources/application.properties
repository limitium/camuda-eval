# Server configuration
server.port=${dmn.port:7070}

# Application context path based on BASE_URL environment variable
server.servlet.context-path=/${BASE_URL:}

# DMN data configuration
dmn.data-root=${dmn.data.root:../data}

# Spring Boot configuration
spring.application.name=camunda-eval
spring.main.banner-mode=off

# Logging configuration
logging.level.limitium.art.camunda.backend=INFO
logging.level.org.springframework.web=INFO

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Git layer. Disabled by default so zero-config startup and the existing tests are unaffected.
dmn.git.enabled=false
# Instances meet only here. Blank: this instance works alone. Secrets come from the environment:
#   dmn.git.username=${GIT_USER}  dmn.git.token=${GIT_TOKEN}
dmn.git.remote-url=
dmn.git.sync-seconds=30
dmn.git.remote-timeout-seconds=30
dmn.git.work-root=
dmn.git.main-branch=main
dmn.git.author-name=camunda-eval
dmn.git.author-email=camunda-eval@localhost

# Identity comes from the proxy that is the only route in; a request without it is a deployment fault.
dmn.auth.user-header=X-Forwarded-User
dmn.auth.allow-anonymous=false

# The 400/404s for a missing or unknown working space are only useful if their message reaches the caller.
server.error.include-message=always

# Tidying old branches: see BranchCleanup. Work never lands in the bin: unlanded work is archived.
dmn.git.stale-after-days=30
dmn.git.idle-grace-days=7
dmn.git.keep-release-lines=3

# Deploying: every domain, to every server this instance names. Secrets come from the environment
# through placeholders and are never shown by the API. Without a server, deploying is refused.
dmn.deploy.env=dev
dmn.deploy.allow-draft-publish=false
dmn.deploy.require-tests=true
