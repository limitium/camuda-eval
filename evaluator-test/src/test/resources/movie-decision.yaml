tests:
  - decision: GenreDecision
    columns: [scenario,                 preferredGenre, "=> genreRecommendation"]
    rows:
           - [comedy maps to Comedy,    comedy,         Comedy]
           - [anything else is Drama,   "any string",   Drama]

  - decision: MovieDecision
    columns: [scenario,                 preferredGenre, userAge, "=> movieRecommendation"]
    rows:
           - [action for an adult,      action,         21,      "Action Thriller"]

  - decision: DrinkDecision
    columns: [scenario,                 userAge, "=> drinkRecommendation"]
    rows:
           - [under age gets juice,     16,      Juice]
