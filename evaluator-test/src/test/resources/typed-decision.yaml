tests:
  - decision: BoolDecision
    columns: [scenario,                 flag,  "=> boolOut"]
    rows:
           - [yes is true,              "yes", true]
           - [anything else is false,   "no",  false]

  - decision: NumDecision
    columns: [scenario,                 n, "=> numOut"]
    rows:
           - [numeric output,           0, 123]

  - decision: StrDecision
    columns: [scenario,                 x,          "=> strOut"]
    rows:
           - [string output,            whatever,   OK]

  - decision: MultiHitDecision
    columns: [scenario,                 x,          "=> mhOut"]
    rows:
           - [collects in rule order,   anything,   [A, B]]
